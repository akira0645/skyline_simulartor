<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>城市街景・手繪像素版</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#202c30;color:#e8e4d1;font:15px system-ui,sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 26px;border-bottom:1px solid #50635c}
    h1{font-size:22px;margin:0 0 4px;font-weight:650}p{margin:0;color:#aabdb0;font-size:13px}
    nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,select{font:inherit;background:#33473f;color:#eee6ce;border:1px solid #698073;border-radius:5px;padding:8px 12px;cursor:pointer}
    button[aria-pressed=true]{background:#d3c59a;color:#273b32}main{overflow:auto;padding:14px 24px 24px}.street{width:max-content;margin:auto}
    .labels{display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:5px 0 12px;color:#d8dfc6;font-size:14px;text-align:center}
    canvas{display:block;image-rendering:pixelated;box-shadow:0 5px 20px #101d2466;border-radius:3px}footer{padding:12px 0;font-size:13px;color:#afc3b2}
    #status{color:#d7c996}a{color:#c0d6bc}
  </style>
</head>
<body>
  <header><div><h1>城市街景・手繪像素版</h1><p>有限色盤、逐像素繪製；建築、樹、人與車使用遊戲中的同一套素材。</p></div>
    <nav><select id="theme" aria-label="城市配色"><option value="classic">經典</option><option value="california">加州</option><option value="sf">舊金山</option><option value="newyork">紐約</option></select>
      <button data-zoom="1">1×</button><button data-zoom="3">3×</button><button data-zoom="6" aria-pressed="true">6×</button><button id="motion">暫停動畫</button><button id="actors">檢查人物與車體</button><button id="step">下一幀</button><a href="/">返回遊戲</a></nav>
  </header>
  <main><div class="street"><div class="labels"><span>獨棟住宅</span><span>公寓</span><span>街角商店</span><span>辦公樓</span><span>工廠</span><span>小學</span></div><div id="canvas"></div>
    <footer id="status">正在載入手繪素材…</footer><p id="guide"></p></div></main>
  <script type="module" src="/tools/street-preview.ts"></script>
</body></html>
